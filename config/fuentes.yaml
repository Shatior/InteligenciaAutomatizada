# Registro de fuentes. Es el activo más valioso del sistema y lo decide el editor, no el código.
#
# Campos:
#   id          identificador estable, sin espacios
#   metodo      rss (por defecto) | html (portada sin feed: requiere `patron`, regex sobre la ruta del artículo)
#   dominio     pista del dominio principal: geopolitica | macro | ciber | transformacion
#   region      global | latam | centroamerica
#   tipo        oficial | think_tank | prensa | especializado
#   fiabilidad  escala Admiralty: A oficial o primaria · B establecida · C desigual o con línea marcada
#   solo_feed   true = no se trae el artículo (muro de pago): se trabaja con titular y resumen
#   navegador   true = si falla la petición simple, se reintenta con Chromium
#   sigilo      true = además se permite el navegador sigiloso que resuelve Cloudflare.
#               Es una decisión por fuente: actívalo solo donde lo hayas valorado.
#   activa      false = se conserva en el registro pero no se lee

